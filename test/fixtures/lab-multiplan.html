<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acme Lab — Plans and Prices</title>
</head>
<body>
  <h1>Acme Lab — Plans and Prices</h1>
  <p class="muted">Multi-plan pricing page for PriceWatch F4 intake tests.</p>
  <div class="plans-grid">
  <div class="plan-card" data-plan-key="free">
    <h3 class="plan-name">Free</h3>
    <div class="plan-price" data-amount="0" data-currency="USD" data-period="month">$0/mo</div>
  </div>
  <div class="plan-card" data-plan-key="starter">
    <h3 class="plan-name">Starter</h3>
    <div class="plan-price" data-amount="19" data-currency="USD" data-period="month">$19/mo</div>
  </div>
  <div class="plan-card" data-plan-key="pro">
    <h3 class="plan-name">Pro</h3>
    <div class="plan-price" data-amount="49" data-currency="USD" data-period="month">$49/mo</div>
  </div>
  <div class="plan-card" data-plan-key="enterprise">
    <h3 class="plan-name">Enterprise</h3>
    <div class="plan-price" data-amount="" data-currency="USD" data-period="custom">Contact us</div>
  </div>
  </div>
</body>
</html>
