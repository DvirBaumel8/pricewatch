# Render Blueprint — PriceWatch (API only)
# https://render.com/docs/blueprint-spec
#
# Secret values are NOT stored here. Set them in Render Dashboard → Environment.
# autoDeploy is false — deploys are triggered by GitHub Actions after CI passes.
#
# ⚠  This file defines ONLY pricewatch-api (free tier).
#    The daily cron service is NOT in this file — it is a paid service
#    (starter, $1+/month) and must NOT be Blueprint-applied until Phase B.
#    See docs/render-ops.md § "Daily cron service (Phase B)" for the
#    ready-to-paste YAML snippet.

services:
  - type: web
    name: pricewatch-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_NODE
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PRICEWATCH_KILL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
